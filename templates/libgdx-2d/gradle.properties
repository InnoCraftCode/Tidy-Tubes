# --- Gradle ---
org.gradle.jvmargs=-Xms512m -Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# --- Project ---
javaToolchainVersion=21

# Release identity. versionCode must increase on every Play upload.
app.versionCode=5

# SDK levels. Google Play requires targetSdk 36 for new apps and updates since 2026-08-31
# (verify: https://developer.android.com/google/play/requirements/target-sdk).
# compileSdk may be newer than targetSdk; install the selected compile platform in SDK Manager.
android.compileSdk=37
android.targetSdk=36
android.minSdk=24

# --- Ads ---
# false = every build uses NoOpAdProvider (no SDK init, no network). Override per run with
#   gradlew :android:assembleDebug -Pads.enabled=false
ads.enabled=true
