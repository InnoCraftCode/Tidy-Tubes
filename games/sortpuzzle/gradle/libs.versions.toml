[versions]
gdx = "1.13.1"
junit = "5.11.4"
agp = "8.11.1"
# GMA Next-Gen SDK (successor of play-services-ads, which is in maintenance mode).
# https://developers.google.com/admob/android/next-gen/quick-start - 1.6.0 (2026-10-22) fixes the
# rewarded callback order and the R8 full-mode consumer rules; verified on device 2026-10-26.
gmaNextGen = "1.6.0"
# User Messaging Platform (consent). https://developers.google.com/admob/android/privacy
ump = "4.0.0"
# play-services-basement (pulled in by the GMA SDK) pins androidx.fragment 1.1.0, which Play
# Console reports as deprecated; this forces a current release (latest stable on 2026-10-28).
androidxFragment = "1.9.1"
# Used directly by AndroidLauncher (WindowInsetsControllerCompat); same version libGDX already pulls in.
androidxCore = "1.13.1"
# Google Play Games Services v2 (sign-in + leaderboards). Latest on Google Maven, 2026-11-02:
# https://dl.google.com/dl/android/maven2/com/google/android/gms/play-services-games-v2/maven-metadata.xml
playGames = "22.1.0"
# Firebase (Analytics + Crashlytics) through the BoM; plugin versions from the same index, 2026-11-02.
firebaseBom = "35.1.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"

[libraries]
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }

gma-nextgen = { module = "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk", version.ref = "gmaNextGen" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }

play-games = { module = "com.google.android.gms:play-services-games-v2", version.ref = "playGames" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
