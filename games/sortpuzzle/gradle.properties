# --- Gradle ---
org.gradle.jvmargs=-Xms512m -Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# compileSdk 37 with AGP 8.11.1 (tested up to 36): silence the advisory, see android/build.gradle.kts
android.suppressUnsupportedCompileSdk=37,37.0

# --- Project ---
# Java toolchain used to compile every module. Bytecode level is pinned per
# module (17 for core/android because of Android's D8, 21 for the desktop launcher).
javaToolchainVersion=21

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# --- Ads ---
# false = every build gets DisabledAdProvider (no SDK init, no network). Override per run with
#   gradlew :android:assembleDebug -Pads.enabled=false
ads.enabled=true
